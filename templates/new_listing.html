{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <h3 class="mb-4">List an Item</h3>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Item Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    <option>Electronics</option>
                    <option>Sports</option>
                    <option>Tools</option>
                    <option>Clothing</option>
                    <option>Books</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="row">
                <div class="col mb-3">
                    <label class="form-label">Rate per Day (₹)</label>
                    <input type="number" name="rate_per_day" class="form-control" required>
                </div>
                <div class="col mb-3">
                    <label class="form-label">Security Deposit (₹)</label>
                    <input type="number" name="deposit" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col mb-3">
                    <label class="form-label">Min Days</label>
                    <input type="number" name="min_days" class="form-control" value="1" required>
                </div>
                <div class="col mb-3">
                    <label class="form-label">Max Days</label>
                    <input type="number" name="max_days" class="form-control" value="30" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Item Photo</label>
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>
            <button type="submit" class="btn btn-dark w-100">List Item</button>
        </form>
    </div>
</div>

{% endblock %}
