{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="mb-2">Verify Your Email</h3>
        <p class="text-muted mb-4">
            We sent a 6-digit OTP to <strong>{{ email }}</strong>.
            Check your inbox (and spam folder).
        </p>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Enter OTP</label>
                <input type="text" name="otp" class="form-control form-control-lg"
                       placeholder="______" maxlength="6"
                       style="letter-spacing: 8px; font-size: 1.5rem; text-align:center;"
                       autofocus required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Verify & Create Account</button>
        </form>

        <p class="mt-3 text-center">
            <a href="{{ url_for('register') }}">← Back to Register</a>
        </p>
    </div>
</div>

{% endblock %}
